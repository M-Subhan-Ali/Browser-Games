<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Sniper</title>
<style>
  html, body { margin: 0; height: 100%; background: #06060c; overflow: hidden;
    font-family: system-ui, sans-serif; color: #ededf2; touch-action: none;
    cursor: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #0a0f0a; border-radius: 10px; max-width: 100%; max-height: 100%; }
  #hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: center;
    gap: 18px; font-weight: 800; font-size: 16px; pointer-events: none; }
  #hud .lo { color: #f87171; }
  #combo { position: fixed; top: 40px; left: 0; right: 0; text-align: center;
    font-weight: 800; color: #22d3ee; pointer-events: none; height: 20px; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(5,5,10,.88);
    text-align: center; cursor: default; }
  button { background: #22d3ee; color: #0a0a0f; border: 0; border-radius: 8px;
    padding: 10px 22px; font-weight: 800; font-size: 16px; cursor: pointer; }
  h1 { margin: 0; font-size: 30px; }
  #sub { color:#9a9ab5; max-width: 320px; }
</style>
</head>
<body>
<div id="hud">
  <span>🎯 <span id="score">0</span></span>
  <span>⏱ <span id="time">60</span>s</span>
  <span>🔫 <span id="ammo">6</span>/6</span>
  <span>❤ <span id="lives">5</span></span>
</div>
<div id="combo"></div>
<div id="wrap"><canvas id="c" width="520" height="560"></canvas></div>
<div id="msg">
  <h1 id="title">Neon Sniper</h1>
  <p id="sub">Move to aim, click or tap to fire. Tag targets before they vanish — the small center ring is a headshot. Empty mag auto-reloads.</p>
  <button id="btn">Start</button>
</div>
<script src="../../portal-sdk.js"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height, MAG=6;
let targets, score, timeLeft, lives, ammo, reloading, combo, running=false, raf=null;
let aim={x:W/2,y:H/2}, shots=[], pops=[], lastSpawn=0, startT=0, muzzle=0;
let hits=0, fired=0;

function reset(){
  targets=[]; score=0; timeLeft=60; lives=5; ammo=MAG; reloading=false;
  combo=0; shots=[]; pops=[]; lastSpawn=0; hits=0; fired=0; startT=performance.now();
  updateHud();
}
function updateHud(){
  document.getElementById('score').textContent=score;
  document.getElementById('time').textContent=Math.max(0,Math.ceil(timeLeft));
  const a=document.getElementById('ammo'); a.textContent=(reloading?'…':ammo)+'/'+MAG;
  a.parentElement.className = ammo===0?'lo':'';
  document.getElementById('lives').textContent=lives;
}
function spawn(){
  const elapsed=(performance.now()-startT)/1000;
  const r=30-Math.min(14, elapsed*0.25);            // targets shrink over time
  const life=Math.max(900, 2200-elapsed*20);         // and vanish faster
  targets.push({ x:40+Math.random()*(W-80), y:70+Math.random()*(H-140),
    r, born:performance.now(), life,
    vx:(Math.random()-0.5)* (0.4+elapsed*0.02)*60/60, vy:(Math.random()-0.5)*0.6 });
}
function fire(){
  if(!running||reloading)return;
  if(ammo<=0){ reload(); return; }
  ammo--; fired++; muzzle=1; updateHud();
  shots.push({x:aim.x,y:aim.y,t:1});
  // closest target under reticle
  let hit=null, best=1e9;
  for(const t of targets){ const d=Math.hypot(t.x-aim.x,t.y-aim.y);
    if(d<=t.r && d<best){ best=d; hit=t; } }
  if(hit){
    const head = best <= hit.r*0.35;
    combo++;
    const mult=1+Math.floor(combo/3);
    const base=head?150:80;
    const gain=base*mult;
    score+=gain; hits++;
    pops.push({x:hit.x,y:hit.y,txt:(head?'HEADSHOT ':'')+'+'+gain, t:1, head});
    targets.splice(targets.indexOf(hit),1);
    showCombo(mult);
  } else {
    combo=0; showCombo(0);
  }
  updateHud();
  if(ammo<=0) reload();
}
function reload(){ if(reloading)return; reloading=true; updateHud();
  setTimeout(()=>{ ammo=MAG; reloading=false; updateHud(); }, 850); }
function showCombo(mult){
  const el=document.getElementById('combo');
  el.textContent = combo>=3 ? ('COMBO x'+combo+(mult>1?'  ('+mult+'×)':'')) : '';
}
function loop(now){
  const dt=16;
  timeLeft-=dt/1000;
  if(timeLeft<=0){ return end(); }
  const elapsed=(now-startT)/1000;
  const interval=Math.max(420, 900-elapsed*8);
  if(now-lastSpawn>interval){ spawn(); lastSpawn=now; }
  // move + expire targets
  for(const t of targets){ t.x+=t.vx; t.y+=t.vy;
    if(t.x<t.r||t.x>W-t.r)t.vx*=-1; if(t.y<60+t.r||t.y>H-t.r)t.vy*=-1; }
  const alive=[];
  for(const t of targets){ if(now-t.born>t.life){ lives--; combo=0; showCombo(0);
      pops.push({x:t.x,y:t.y,txt:'MISS',t:1,miss:true}); updateHud();
      if(lives<=0){ draw(); return end(); } }
    else alive.push(t); }
  targets=alive;
  muzzle*=0.8;
  draw();
  if(running) raf=requestAnimationFrame(loop);
}
function draw(){
  ctx.fillStyle='#0a0f0a'; ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle='#12241a'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=40;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // targets
  for(const t of targets){
    const age=(performance.now()-t.born)/t.life;
    const hue = age>0.7 ? 0 : 150;                     // turn red before vanishing
    ctx.save(); ctx.shadowColor='hsl('+hue+' 80% 55%)'; ctx.shadowBlur=14;
    for(let i=3;i>=1;i--){ ctx.beginPath(); ctx.arc(t.x,t.y,t.r*i/3,0,7);
      ctx.strokeStyle=i%2? 'hsl('+hue+' 80% 60%)' : 'hsl('+hue+' 80% 40%)';
      ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(t.x,t.y,t.r*0.35,0,7);
    ctx.fillStyle='hsl('+hue+' 85% 60%)'; ctx.fill();   // headshot core
    ctx.restore();
  }
  // bullet holes
  shots.forEach(s=>{ ctx.fillStyle='rgba(255,255,255,'+s.t*0.6+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,3,0,7); ctx.fill(); s.t-=0.04; });
  shots=shots.filter(s=>s.t>0);
  // score pops
  pops.forEach(p=>{ ctx.globalAlpha=p.t; ctx.font='bold 16px system-ui'; ctx.textAlign='center';
    ctx.fillStyle=p.miss?'#f87171':p.head?'#fbbf24':'#22d3ee';
    ctx.fillText(p.txt, p.x, p.y-24*(1-p.t)-10); ctx.globalAlpha=1; p.t-=0.02; });
  pops=pops.filter(p=>p.t>0);
  // scope vignette
  const g=ctx.createRadialGradient(aim.x,aim.y,60,aim.x,aim.y,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawReticle();
  if(muzzle>0.05){ ctx.fillStyle='rgba(255,255,255,'+muzzle+')'; ctx.fillRect(0,0,W,H); }
}
function drawReticle(){
  const {x,y}=aim; ctx.save();
  ctx.strokeStyle= reloading?'#f87171':'#22d3ee'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fillStyle=ctx.strokeStyle; ctx.fill();
  const g=14;
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{ ctx.beginPath();
    ctx.moveTo(x+dx*12,y+dy*12); ctx.lineTo(x+dx*(12+g),y+dy*(12+g)); ctx.stroke(); });
  ctx.restore();
}
async function end(){ running=false; cancelAnimationFrame(raf);
  const acc = fired? Math.round(hits/fired*100):0;
  Portal.submitScore(score); Portal.gameplayStop();
  show('Time / Out','Score '+score+' · Accuracy '+acc+'%','Play again');
}
function show(t,s,b){ document.getElementById('title').textContent=t;
  document.getElementById('sub').textContent=s; document.getElementById('btn').textContent=b;
  document.getElementById('msg').style.display='flex'; document.body.style.cursor='default'; }
function start(){ document.getElementById('msg').style.display='none';
  document.body.style.cursor='none'; reset(); running=true; Portal.gameplayStart();
  lastSpawn=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
function toCanvas(clientX,clientY){ const r=cv.getBoundingClientRect();
  aim.x=(clientX-r.left)*(W/r.width); aim.y=(clientY-r.top)*(H/r.height); }
cv.addEventListener('mousemove',e=>toCanvas(e.clientX,e.clientY));
cv.addEventListener('mousedown',e=>{ toCanvas(e.clientX,e.clientY); fire(); });
cv.addEventListener('touchstart',e=>{ toCanvas(e.touches[0].clientX,e.touches[0].clientY);
  draw(); fire(); e.preventDefault(); },{passive:false});
cv.addEventListener('touchmove',e=>{ toCanvas(e.touches[0].clientX,e.touches[0].clientY);
  e.preventDefault(); },{passive:false});
document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='r')reload(); });
document.getElementById('btn').addEventListener('click',start);

(async function(){ await Portal.ready(); reset(); draw();
  show('Neon Sniper','Move to aim, click or tap to fire. Tag targets before they vanish — the small center ring is a headshot. Empty mag auto-reloads.','Start'); })();
</script>
</body>
</html>
