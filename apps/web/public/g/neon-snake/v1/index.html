<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden;
    font-family: system-ui, sans-serif; color: #ededf2; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #0d0d16; border-radius: 8px; max-width: 100%; max-height: 100%; }
  #hud { position: fixed; top: 10px; left: 12px; font-size: 16px; font-weight: 700; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(5,5,10,.85); text-align: center; }
  button { background: #22d3ee; color: #0a0a0f; border: 0; border-radius: 8px;
    padding: 10px 20px; font-weight: 700; font-size: 16px; cursor: pointer; }
  h1 { margin: 0; font-size: 28px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="420" height="420"></canvas></div>
<div id="hud">Score: <span id="score">0</span> · Best: <span id="best">0</span></div>
<div id="msg">
  <h1 id="title">Neon Snake</h1>
  <p id="sub">Arrow keys / swipe to move</p>
  <button id="btn">Play</button>
</div>
<script src="../../portal-sdk.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GRID = 21, CELL = cv.width / GRID;
let snake, dir, nextDir, food, score, best = 0, running = false, timer = null;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; placeFood(); updateHud();
}
function placeFood() {
  do { food = {x: (Math.random()*GRID)|0, y: (Math.random()*GRID)|0}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}
function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||
      snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver();
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) { score += 10; updateHud(); placeFood(); }
  else snake.pop();
  draw();
}
function draw() {
  ctx.fillStyle = '#0d0d16'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#a855f7';
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 8;
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
  ctx.shadowColor = '#22d3ee';
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#67e8f9' : '#22d3ee';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
  ctx.shadowBlur = 0;
}
async function gameOver() {
  running = false; clearInterval(timer);
  if (score > best) { best = score; updateHud(); Portal.save({best: best}); }
  Portal.submitScore(score);
  Portal.gameplayStop();
  show('Game Over', 'Score: ' + score, 'Play again');
}
function show(t, s, b) {
  document.getElementById('title').textContent = t;
  document.getElementById('sub').textContent = s;
  document.getElementById('btn').textContent = b;
  document.getElementById('msg').style.display = 'flex';
}
function start() {
  document.getElementById('msg').style.display = 'none';
  reset(); running = true; Portal.gameplayStart();
  clearInterval(timer); timer = setInterval(step, 110); draw();
}
function setDir(x,y){ if (dir.x!==-x && dir.y!==-y) nextDir = {x,y}; }

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k==='ArrowUp') setDir(0,-1);
  else if (k==='ArrowDown') setDir(0,1);
  else if (k==='ArrowLeft') setDir(-1,0);
  else if (k==='ArrowRight') setDir(1,0);
  if (k.startsWith('Arrow')) e.preventDefault();
});
let ts = null;
cv.parentElement.addEventListener('touchstart', e => { ts = e.touches[0]; }, {passive:true});
cv.parentElement.addEventListener('touchend', e => {
  if (!ts) return; const t = e.changedTouches[0];
  const dx = t.clientX - ts.clientX, dy = t.clientY - ts.clientY;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
  ts = null;
}, {passive:true});
document.getElementById('btn').addEventListener('click', start);

(async function init() {
  await Portal.ready();
  const saved = await Portal.load();
  if (saved && saved.best) { best = saved.best; updateHud(); }
  reset(); draw();
  show('Neon Snake', 'Arrow keys / swipe to move', 'Play');
})();
</script>
</body>
</html>
