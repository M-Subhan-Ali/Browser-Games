<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>2048</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden;
    font-family: system-ui, sans-serif; color: #ededf2; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 12px; }
  #hud { font-size: 18px; font-weight: 700; }
  #board { position: relative; background: #13131d; border-radius: 10px; padding: 10px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    width: min(92vw, 420px); aspect-ratio: 1; }
  .cell { background: #1b1b29; border-radius: 8px; }
  .tile { position: absolute; display: flex; align-items: center; justify-content: center;
    font-weight: 800; border-radius: 8px; transition: all .1s ease; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(5,5,10,.85); text-align: center; }
  button { background: #22d3ee; color: #0a0a0f; border: 0; border-radius: 8px;
    padding: 10px 20px; font-weight: 700; font-size: 16px; cursor: pointer; }
  h1 { margin: 0; font-size: 28px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">Score: <span id="score">0</span> · Best: <span id="best">0</span></div>
  <div id="board"></div>
  <p style="color:#9a9ab5;font-size:14px;margin:0">Arrow keys or swipe</p>
</div>
<div id="msg">
  <h1 id="title">2048</h1>
  <p id="sub">Slide tiles to merge them</p>
  <button id="btn">Play</button>
</div>
<script src="../../portal-sdk.js"></script>
<script>
const N = 4, board = document.getElementById('board');
let grid, score, best = 0, running = false, tiles = [];
const COLORS = {2:'#334155',4:'#3f4a63',8:'#4f46e5',16:'#6366f1',32:'#8b5cf6',
  64:'#a855f7',128:'#c026d3',256:'#db2777',512:'#e11d48',1024:'#f59e0b',2048:'#22d3ee'};

function init() {
  board.querySelectorAll('.cell,.tile').forEach(e=>e.remove());
  for (let i=0;i<16;i++){ const c=document.createElement('div'); c.className='cell'; board.appendChild(c); }
  grid = Array.from({length:N},()=>Array(N).fill(0));
  score = 0; updateHud(); addTile(); addTile(); render();
}
function updateHud(){ document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best; }
function empties(){ const e=[]; for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])e.push([r,c]); return e; }
function addTile(){ const e=empties(); if(!e.length)return;
  const [r,c]=e[(Math.random()*e.length)|0]; grid[r][c]=Math.random()<0.9?2:4; }
function render(){
  board.querySelectorAll('.tile').forEach(t=>t.remove());
  const size = board.clientWidth, pad = 10, gap = 10, cell = (size - pad*2 - gap*3)/4;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=grid[r][c]; if(!v)continue;
    const t=document.createElement('div'); t.className='tile'; t.textContent=v;
    t.style.width=t.style.height=cell+'px';
    t.style.left=(pad+c*(cell+gap))+'px'; t.style.top=(pad+r*(cell+gap))+'px';
    t.style.background=COLORS[v]||'#22d3ee'; t.style.color=v<=4?'#cbd5e1':'#0a0a0f';
    t.style.fontSize=(v<100?cell*0.42:v<1000?cell*0.34:cell*0.26)+'px';
    board.appendChild(t);
  }
}
function slide(row){
  let a=row.filter(x=>x); let out=[];
  for(let i=0;i<a.length;i++){ if(a[i]===a[i+1]){ out.push(a[i]*2); score+=a[i]*2; i++; } else out.push(a[i]); }
  while(out.length<N)out.push(0); return out;
}
function rotate(g){ const n=g.map(r=>r.slice()); const o=Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)o[c][N-1-r]=n[r][c]; return o; }
function move(dir){
  if(!running)return;
  const before=JSON.stringify(grid);
  let g=grid, rot=({left:0,up:3,right:2,down:1})[dir];
  for(let i=0;i<rot;i++)g=rotate(g);
  g=g.map(slide);
  for(let i=0;i<(4-rot)%4;i++)g=rotate(g);
  grid=g;
  if(JSON.stringify(grid)!==before){ addTile(); updateHud(); render();
    if(score>best){best=score; Portal.save({best:best}); updateHud();}
    if(isOver())gameOver(); }
}
function isOver(){ if(empties().length)return false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(c<N-1&&grid[r][c]===grid[r][c+1])return false;
    if(r<N-1&&grid[r][c]===grid[r+1][c])return false; } return true; }
async function gameOver(){ running=false; Portal.submitScore(score); Portal.gameplayStop();
  show('Game Over','Score: '+score,'Play again'); }
function show(t,s,b){ document.getElementById('title').textContent=t;
  document.getElementById('sub').textContent=s; document.getElementById('btn').textContent=b;
  document.getElementById('msg').style.display='flex'; }
function start(){ document.getElementById('msg').style.display='none';
  init(); running=true; Portal.gameplayStart(); }
document.addEventListener('keydown',e=>{
  const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
  if(m){ move(m); e.preventDefault(); } });
let ts=null;
document.getElementById('wrap').addEventListener('touchstart',e=>{ts=e.touches[0];},{passive:true});
document.getElementById('wrap').addEventListener('touchend',e=>{
  if(!ts)return; const t=e.changedTouches[0];
  const dx=t.clientX-ts.clientX, dy=t.clientY-ts.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){ts=null;return;}
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
  ts=null;
},{passive:true});
document.getElementById('btn').addEventListener('click',start);
window.addEventListener('resize',render);

(async function(){
  await Portal.ready();
  const s=await Portal.load(); if(s&&s.best){best=s.best;updateHud();}
  init(); show('2048','Slide tiles to merge them','Play');
})();
</script>
</body>
</html>
