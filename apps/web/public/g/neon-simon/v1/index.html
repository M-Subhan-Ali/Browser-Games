<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Simon</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden;
    font-family: system-ui, sans-serif; color: #ededf2; touch-action: manipulation; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 12px; box-sizing: border-box; }
  #hud { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  #hud .r { color: #22d3ee; } #hud .b { color: #a855f7; }
  #board { position: relative; width: min(82vw, 340px); aspect-ratio: 1; border-radius: 50%;
    background: #0d0d16; box-shadow: 0 0 0 6px #14141f; }
  .pad { position: absolute; width: 50%; height: 50%; cursor: pointer; opacity: .34;
    transition: opacity .08s; }
  .pad.lit { opacity: 1; }
  .g { background: #4ade80; top: 0; left: 0; border-radius: 100% 0 0 0; box-shadow: inset 0 0 30px #16a34a; }
  .r { background: #f43f5e; top: 0; right: 0; border-radius: 0 100% 0 0; box-shadow: inset 0 0 30px #9f1239; }
  .y { background: #facc15; bottom: 0; left: 0; border-radius: 0 0 0 100%; box-shadow: inset 0 0 30px #a16207; }
  .bl { background: #38bdf8; bottom: 0; right: 0; border-radius: 0 0 100% 0; box-shadow: inset 0 0 30px #075985; }
  #center { position: absolute; inset: 32%; border-radius: 50%; background: #0a0a0f;
    display: flex; align-items: center; justify-content: center; font-weight: 800;
    font-size: 22px; color: #ededf2; box-shadow: 0 0 0 4px #14141f; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(5,5,10,.9); text-align: center; padding: 20px; }
  button { background: #22d3ee; color: #0a0a0f; border: 0; border-radius: 8px;
    padding: 10px 20px; font-weight: 700; font-size: 16px; cursor: pointer; }
  h1 { margin: 0; font-size: 28px; } p { margin: 0; color: #a1a1b5; max-width: 320px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span class="r">Round <span id="round">0</span></span> &nbsp;·&nbsp; <span class="b">Best <span id="best">0</span></span></div>
  <div id="board">
    <div class="pad g" data-k="0"></div>
    <div class="pad r" data-k="1"></div>
    <div class="pad y" data-k="2"></div>
    <div class="pad bl" data-k="3"></div>
    <div id="center">—</div>
  </div>
</div>
<div id="msg">
  <h1 id="title">Neon Simon</h1>
  <p id="sub">Watch the sequence, then repeat it. It grows by one each round.</p>
  <button id="btn">Play</button>
</div>
<script src="../../portal-sdk.js"></script>
<script>
const pads = [...document.querySelectorAll('.pad')];
const center = document.getElementById('center');
const FREQ = [329.6, 440.0, 277.2, 554.4]; // E4, A4, C#4, C#5
let seq, input, round, best = 0, accepting = false, actx = null;

function beep(k, ms) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = FREQ[k];
    g.gain.value = 0.0001; o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.start(t); o.stop(t + ms / 1000 + 0.02);
  } catch (e) { /* audio optional */ }
}
function flash(k, ms) {
  return new Promise(res => {
    pads[k].classList.add('lit'); beep(k, ms);
    setTimeout(() => { pads[k].classList.remove('lit'); setTimeout(res, 140); }, ms);
  });
}
function updateHud() {
  document.getElementById('round').textContent = round;
  document.getElementById('best').textContent = best;
}
async function playSequence() {
  accepting = false; center.textContent = '▶';
  await new Promise(r => setTimeout(r, 500));
  const speed = Math.max(220, 520 - round * 20);
  for (const k of seq) await flash(k, speed);
  accepting = true; input = 0; center.textContent = '?';
}
async function nextRound() {
  round++; updateHud();
  seq.push((Math.random() * 4) | 0);
  await playSequence();
}
async function press(k) {
  if (!accepting) return;
  pads[k].classList.add('lit'); beep(k, 220);
  setTimeout(() => pads[k].classList.remove('lit'), 180);
  if (k === seq[input]) {
    input++;
    if (input === seq.length) { accepting = false; center.textContent = '✓'; setTimeout(nextRound, 650); }
  } else {
    gameOver();
  }
}
async function gameOver() {
  accepting = false; center.textContent = '✕';
  const reached = round;
  if (reached > best) { best = reached; updateHud(); Portal.save({ best: best }); }
  Portal.submitScore(reached);
  Portal.gameplayStop();
  show('Game Over', 'You reached round ' + reached + ' · Best ' + best, 'Play again');
}
function show(t, s, b) {
  document.getElementById('title').textContent = t;
  document.getElementById('sub').textContent = s;
  document.getElementById('btn').textContent = b;
  document.getElementById('msg').style.display = 'flex';
}
function start() {
  document.getElementById('msg').style.display = 'none';
  seq = []; round = 0; updateHud(); Portal.gameplayStart();
  nextRound();
}
pads.forEach(p => p.addEventListener('pointerdown', () => press(+p.dataset.k)));
document.getElementById('btn').addEventListener('click', start);

(async function init() {
  await Portal.ready();
  const saved = await Portal.load();
  if (saved && saved.best) best = saved.best;
  round = 0; updateHud();
  show('Neon Simon', 'Watch the sequence, then repeat it. It grows by one each round.', 'Play');
})();
</script>
</body>
</html>
