<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Box Push</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden;
    font-family: system-ui, sans-serif; color: #ededf2; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 10px; box-sizing: border-box; }
  #hud { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
  #hud .l { color: #22d3ee; } #hud .m { color: #a855f7; }
  canvas { background: #0d0d16; border-radius: 10px; max-width: 94vw; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; }
  .dpad button { font-size: 20px; }
  .dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
  button { background: #0d0d16; color: #ededf2; border: 1px solid #2a2a3c; border-radius: 10px;
    padding: 0; min-width: 48px; height: 48px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .side { display: flex; flex-direction: column; gap: 6px; }
  .side button { padding: 0 12px; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(5,5,10,.9); text-align: center; padding: 20px; }
  #msg button { background: #22d3ee; color: #0a0a0f; border: 0; height: auto; padding: 10px 20px; font-size: 16px; }
  h1 { margin: 0; font-size: 28px; } p { margin: 0; color: #a1a1b5; max-width: 320px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span class="l">Level <span id="lvl">1</span>/<span id="total">1</span></span> &nbsp;·&nbsp; <span class="m">Moves <span id="moves">0</span></span></div>
  <canvas id="c" width="420" height="300"></canvas>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-d="0,-1">▲</button>
      <button class="left" data-d="-1,0">◀</button>
      <button class="right" data-d="1,0">▶</button>
      <button class="down" data-d="0,1">▼</button>
    </div>
    <div class="side">
      <button id="undo">Undo</button>
      <button id="restart">Restart</button>
    </div>
  </div>
</div>
<div id="msg">
  <h1 id="title">Box Push</h1>
  <p id="sub">Push every box onto a glowing pad. Arrow keys, swipe, or the buttons.</p>
  <button id="btn">Play</button>
</div>
<script src="../../portal-sdk.js"></script>
<script>
// Legend: # wall, . goal, $ box, * box on goal, @ player, + player on goal, space floor.
const LEVELS = [
  ["#######",
   "#@ $ .#",
   "#######"],
  ["#######",
   "#.$@$.#",
   "#######"],
  ["######",
   "#@   #",
   "# $  #",
   "#  . #",
   "######"],
  ["#######",
   "#.   .#",
   "#$   $#",
   "#  @  #",
   "#######"],
  ["#######",
   "#.   .#",
   "# $ $ #",
   "#  @  #",
   "# $ $ #",
   "#.   .#",
   "#######"],
];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let walls, goals, boxes, px, py, rows, cols, moves, history, levelIdx = 0, running = false;

function parse(map) {
  rows = map.length; cols = Math.max(...map.map(r => r.length));
  walls = new Set(); goals = new Set(); boxes = new Set();
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x] || ' ';
    const k = x + ',' + y;
    if (ch === '#') walls.add(k);
    if (ch === '.' || ch === '*' || ch === '+') goals.add(k);
    if (ch === '$' || ch === '*') boxes.add(k);
    if (ch === '@' || ch === '+') { px = x; py = y; }
  }
}
function loadLevel(i) {
  levelIdx = i; parse(LEVELS[i]); moves = 0; history = [];
  document.getElementById('lvl').textContent = i + 1;
  document.getElementById('total').textContent = LEVELS.length;
  document.getElementById('moves').textContent = 0;
  const cell = Math.min(Math.floor((Math.min(window.innerWidth * 0.9, 460)) / cols), 56);
  cv.width = cols * cell; cv.height = rows * cell;
  draw();
}
function snapshot() { return { px, py, boxes: [...boxes], moves }; }
function restore(s) { px = s.px; py = s.py; boxes = new Set(s.boxes); moves = s.moves; document.getElementById('moves').textContent = moves; draw(); }

function move(dx, dy) {
  if (!running) return;
  const nx = px + dx, ny = py + dy, nk = nx + ',' + ny;
  if (walls.has(nk)) return;
  if (boxes.has(nk)) {
    const bx = nx + dx, by = ny + dy, bk = bx + ',' + by;
    if (walls.has(bk) || boxes.has(bk)) return;
    history.push(snapshot());
    boxes.delete(nk); boxes.add(bk);
  } else {
    history.push(snapshot());
  }
  px = nx; py = ny; moves++;
  document.getElementById('moves').textContent = moves;
  draw();
  if ([...goals].every(g => boxes.has(g))) setTimeout(solved, 180);
}
function undo() { if (running && history.length) restore(history.pop()); }

function draw() {
  const cell = cv.width / cols;
  ctx.fillStyle = '#0d0d16'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const k = x + ',' + y, X = x * cell, Y = y * cell;
    if (walls.has(k)) {
      ctx.fillStyle = '#1b1b2a'; ctx.fillRect(X + 1, Y + 1, cell - 2, cell - 2);
    } else if (goals.has(k)) {
      ctx.fillStyle = '#a855f7'; ctx.globalAlpha = boxes.has(k) ? 1 : 0.4;
      ctx.beginPath(); ctx.arc(X + cell / 2, Y + cell / 2, cell * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // boxes
  for (const k of boxes) {
    const [x, y] = k.split(',').map(Number), X = x * cell, Y = y * cell;
    const onGoal = goals.has(k);
    ctx.fillStyle = onGoal ? '#4ade80' : '#22d3ee';
    ctx.shadowColor = onGoal ? '#4ade80' : '#22d3ee'; ctx.shadowBlur = 12;
    ctx.fillRect(X + cell * 0.14, Y + cell * 0.14, cell * 0.72, cell * 0.72);
    ctx.shadowBlur = 0;
  }
  // player
  ctx.fillStyle = '#f472b6'; ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(px * cell + cell / 2, py * cell + cell / 2, cell * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}
function solved() {
  running = false;
  if (levelIdx + 1 < LEVELS.length) {
    Portal.save({ level: levelIdx + 1 });
    show('Level clear!', 'On to level ' + (levelIdx + 2) + '.', 'Next level');
  } else {
    Portal.save({ level: 0 });
    Portal.gameplayStop();
    show('All levels clear!', 'You pushed every box home. Play again?', 'Restart from 1');
  }
}
function show(t, s, b) {
  document.getElementById('title').textContent = t;
  document.getElementById('sub').textContent = s;
  document.getElementById('btn').textContent = b;
  document.getElementById('msg').style.display = 'flex';
}
function play() {
  document.getElementById('msg').style.display = 'none';
  running = true; Portal.gameplayStart();
}
document.getElementById('btn').addEventListener('click', () => {
  if (!running && levelIdx + 1 < LEVELS.length && [...goals].every(g => boxes.has(g))) {
    loadLevel(levelIdx + 1);
  } else if (!running && [...goals].every(g => boxes.has(g))) {
    loadLevel(0);
  }
  play();
});
document.querySelectorAll('.dpad button').forEach(b => {
  b.addEventListener('click', () => { const [dx, dy] = b.dataset.d.split(',').map(Number); move(dx, dy); });
});
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('restart').addEventListener('click', () => loadLevel(levelIdx));
document.addEventListener('keydown', e => {
  const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
  if (map[e.key]) { move(...map[e.key]); e.preventDefault(); }
  else if (e.key === 'z') undo();
  else if (e.key === 'r') loadLevel(levelIdx);
});
let ts = null;
cv.addEventListener('touchstart', e => { ts = e.touches[0]; }, { passive: true });
cv.addEventListener('touchend', e => {
  if (!ts) return; const t = e.changedTouches[0];
  const dx = t.clientX - ts.clientX, dy = t.clientY - ts.clientY;
  if (Math.abs(dx) < 16 && Math.abs(dy) < 16) { ts = null; return; }
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0); else move(0, dy > 0 ? 1 : -1);
  ts = null;
}, { passive: true });

(async function init() {
  await Portal.ready();
  const saved = await Portal.load();
  const start = (saved && Number.isInteger(saved.level) && saved.level < LEVELS.length) ? saved.level : 0;
  loadLevel(start);
  show('Box Push', 'Push every box onto a glowing pad. Arrow keys, swipe, or the buttons.',
    start > 0 ? 'Resume level ' + (start + 1) : 'Play');
})();
</script>
</body>
</html>
