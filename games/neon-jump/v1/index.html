<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Jump</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden;
    font-family: system-ui, sans-serif; color: #ededf2; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #0d0d16; border-radius: 8px; max-width: 100%; max-height: 100%; }
  #hud { position: fixed; top: 10px; left: 12px; font-size: 16px; font-weight: 700; }
  #msg { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; background: rgba(5,5,10,.85); text-align: center; }
  button { background: #22d3ee; color: #0a0a0f; border: 0; border-radius: 8px;
    padding: 10px 20px; font-weight: 700; font-size: 16px; cursor: pointer; }
  h1 { margin: 0; font-size: 28px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="420" height="520"></canvas></div>
<div id="hud">Score: <span id="score">0</span></div>
<div id="msg">
  <h1 id="title">Neon Jump</h1>
  <p id="sub">Click / tap / space to flap</p>
  <button id="btn">Play</button>
</div>
<script src="../../portal-sdk.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GAP = 140, PIPE_W = 60, SPEED = 2.4;
let bird, pipes, score, running = false, raf = null, frame = 0;

function reset() {
  bird = { x: 110, y: H/2, vy: 0, r: 12 };
  pipes = []; score = 0; frame = 0; updateHud();
}
function updateHud() { document.getElementById('score').textContent = score; }
function spawn() {
  const top = 60 + Math.random() * (H - GAP - 160);
  pipes.push({ x: W, top: top, passed: false });
}
function loop() {
  frame++;
  bird.vy += 0.5; bird.y += bird.vy;
  if (frame % 95 === 0) spawn();
  for (const p of pipes) {
    p.x -= SPEED;
    if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; updateHud(); }
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W &&
        (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP)) return gameOver();
  }
  pipes = pipes.filter(p => p.x + PIPE_W > 0);
  if (bird.y + bird.r > H || bird.y - bird.r < 0) return gameOver();
  draw();
  raf = requestAnimationFrame(loop);
}
function draw() {
  ctx.fillStyle = '#0d0d16'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#a855f7'; ctx.shadowColor='#a855f7'; ctx.shadowBlur=8;
  for (const p of pipes) {
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + GAP, PIPE_W, H - p.top - GAP);
  }
  ctx.shadowColor='#22d3ee'; ctx.fillStyle = '#67e8f9';
  ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
}
async function gameOver() {
  running = false; cancelAnimationFrame(raf);
  Portal.submitScore(score); Portal.gameplayStop();
  show('Game Over', 'Score: ' + score, 'Play again');
}
function show(t, s, b) {
  document.getElementById('title').textContent = t;
  document.getElementById('sub').textContent = s;
  document.getElementById('btn').textContent = b;
  document.getElementById('msg').style.display = 'flex';
}
function start() {
  document.getElementById('msg').style.display = 'none';
  reset(); running = true; Portal.gameplayStart();
  cancelAnimationFrame(raf); loop();
}
function flap() { if (running) bird.vy = -8; }
document.addEventListener('keydown', e => { if (e.code==='Space'){ flap(); e.preventDefault(); } });
cv.addEventListener('mousedown', flap);
cv.addEventListener('touchstart', e => { flap(); e.preventDefault(); }, {passive:false});
document.getElementById('btn').addEventListener('click', start);

(async function init() {
  await Portal.ready();
  reset(); draw();
  show('Neon Jump', 'Click / tap / space to flap', 'Play');
})();
</script>
</body>
</html>
